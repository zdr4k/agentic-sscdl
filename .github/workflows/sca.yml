name: "SCA: Snyk"

on:
  pull_request:
    paths:
      - "requirements.txt"
  schedule:
    # New CVEs get published even when requirements.txt hasn't
    # changed in months. This is what catches those.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Snyk to check for vulnerabilities
        # Snyk's action fails the job on finding a vulnerability,
        # which would otherwise skip the SARIF upload step below.
        continue-on-error: true
        uses: snyk/actions/python@12140f4059e244892ae643824a95459a102120dd # master, pinned 2026-09-19
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif --severity-threshold=high

      - name: Upload results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk.sarif
          category: snyk-sca