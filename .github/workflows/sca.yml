name: "SCA: Snyk"

on:
  pull_request:
    paths:
      - "requirements.txt"
  schedule:
    # New CVEs get published even when requirements.txt hasn't
    # changed in months. This is what catches those.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Snyk to check for vulnerabilities
        # Snyk's action fails the job on finding a vulnerability,
        # which would otherwise skip the SARIF upload step below.
        continue-on-error: true
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif --severity-threshold=high

      - name: Upload results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif