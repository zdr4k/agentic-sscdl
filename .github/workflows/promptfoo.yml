name: "DAST: promptfoo"

on:
  pull_request:
    paths:
      - "mcp/**"
      - "promptfooconfig.yaml"

permissions: {}

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Seed the database
        run: python scripts/create_db.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Run promptfoo against the MCP server
        # promptfoo exits 100 on any failed assertion, no continue-on-error
        # trick needed here: there's no SARIF upload after it, this job's
        # own pass/fail is the whole signal.
        run: npx --yes promptfoo@latest eval -c promptfooconfig.yaml
