name: "DAST: promptfoo"

on:
  pull_request:
    paths:
      - "mcp/**"
      - "agent/**"
      - "promptfoo*.yaml"

permissions: {}

jobs:
  tool:
    name: attack the MCP tool directly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed the database
        run: python scripts/create_db.py

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Run promptfoo against the MCP server
        # promptfoo exits 100 on any failed assertion, no continue-on-error
        # trick needed here: there's no SARIF upload after it, this job's
        # own pass/fail is the whole signal.
        run: npx -y promptfoo@latest eval -c promptfooconfig.yaml --no-cache

  agent:
    name: red-team the live agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Models inference, so the agent has a brain in CI without
      # a GPU or a separate API key: the job's own GITHUB_TOKEN covers it.
      models: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed the database
        run: python scripts/create_db.py

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Run promptfoo against the live agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_BACKEND: github
        run: npx -y promptfoo@latest eval -c promptfoo.agent.yaml --no-cache
